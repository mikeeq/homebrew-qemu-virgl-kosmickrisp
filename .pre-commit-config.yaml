# Pre-commit hooks to validate this Homebrew tap.
# Install:  pipx install pre-commit  (or: brew install pre-commit)
# Enable:   pre-commit install
# Run all:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-yaml

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      # Validates GitHub Actions workflows; also runs shellcheck on inline
      # `run:` scripts when shellcheck is installed.
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      # Lints standalone shell scripts (e.g. scripts/build.sh).
      - id: shellcheck

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: local
    hooks:
      - id: brew-style
        name: brew style (Homebrew formula lint)
        entry: bash -c 'if command -v brew >/dev/null 2>&1; then brew style Formula/qemu.rb; else echo "brew not found; skipping brew style"; fi'
        language: system
        files: ^Formula/.*\.rb$
        pass_filenames: false
      - id: ruby-syntax
        name: ruby -c (formula syntax check)
        entry: ruby -c
        language: system
        files: ^Formula/.*\.rb$
